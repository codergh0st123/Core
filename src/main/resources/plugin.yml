name: Core
main: ru.core.Core
version: ${project.version}
api-version: '1.21'
author: gh0st
softdepend:
  - PlaceholderAPI
  - ProtocolLib
  - ViaVersion
  - ViaBackwards
  - LuckPerms
  - DonationAlerts
  - FreeSystem
  - DonatePoints
  - AuroraChat
  - TAB
libraries:
  - com.mysql:mysql-connector-j:9.1.0
  - org.xerial:sqlite-jdbc:3.47.0.0
commands:
  core:
    description: Core plugin info and reload
    aliases:
      - ver
      - version
      - gcore
      - bukkitcore
      - ludocore
      - cokcore
      - ядросервера
      - zlhj
  log:
    description: Server log tools
  console:
    description: Console tools
  play:
    description: Connect to a game server
  hub:
    description: Return to the lobby
    aliases:
      - lobby
  find:
    description: Find which server a player is on
  server:
    description: Switch or view servers
  list:
    description: Show online players
    aliases:
      - online
  alert:
    description: Broadcast a network alert
  pc:
    description: Premium chat
    aliases:
      - pchat
  schat:
    description: Staff chat
  playtime:
    description: Show your playtime
    aliases:
      - времякотороетыпросрал
  lang:
    description: Change language
  language:
    description: Open language menu
    aliases:
      - lang-gui
  time:
    description: Change world time
permissions:
  core.reload:
    default: op
  core.alert:
    default: op
  core.log:
    default: op
  core.console:
    default: op
  core.time:
    default: op
  core.find:
    default: true
  core.server:
    default: op
  core.list:
    default: true
  core.list.all:
    default: op
  core.language:
    default: true
  core.chat.premium:
    default: op
  core.chat.staff:
    default: op
