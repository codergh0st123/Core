name: Core
main: ru.core.Core
version: ${project.version}
api-version: '1.21'
author: gh0st
softdepend:
  - PlaceholderAPI
  - ProtocolLib
  - ViaVersion
  - ViaBackwards
  - LuckPerms
  - DonationAlerts
  - FreeSystem
  - DonatePoints
  - AuroraChat
libraries:
  - com.mysql:mysql-connector-j:9.1.0
  - org.xerial:sqlite-jdbc:3.47.0.0
commands:
  core:
    aliases:
      - ver
      - version
      - gcore
      - bukkitcore
      - ludocore
      - cokcore
      - ядросервера
      - zlhj
  log:
  play:
  hub:
    aliases:
      - lobby
  find:
  server:
  list:
    aliases:
      - online
  alert:
  pc:
    aliases:
      - pchat
  schat:
  playtime:
    aliases:
      - времякотороетыпросрал
  lang:
  language:
    aliases:
      - lang-gui
  time:
permissions:
  core.reload:
    default: op
  core.alert:
    default: op
  core.log:
    default: op
  core.time:
    default: op
  core.find:
    default: true
  core.server:
    default: op
  core.list:
    default: true
  core.list.all:
    default: op
  core.language:
    default: true
  core.chat.premium:
    default: op
  core.chat.staff:
    default: op
