SERVER: "server-1"

PROTOCOLLIB:
  ENABLED: true
  DUPLICATE-WINDOW-MILLIS: 100

MESSAGES:
  HIDE:
    ADVANCEMENTS: true
    JOIN: true
    QUIT: true

DEBUG:
  ENABLED: true
  SOURCES:
    DONATIONALERTS: true
    FREESYSTEM: true
    DONATEPOINTS: true

ITEM-CLEANER:
  ENABLED: true
  CHECK-INTERVAL: 300
  MINIMUM-ITEMS: 50
  CLEAR-DELAY: 30
  WARNING-SECONDS:
    - 30
    - 10
    - 5
  MESSAGES:
    WARNING:
      - ""
      - "&eОптимизация сервера &8» &fЧерез &e%SECONDS% сек. &fбудет выполнена очистка выброшенных предметов."
      - "&7Подберите важные предметы с земли."
      - ""
    CLEARED:
      - ""
      - "&aОптимизация сервера &8» &fУдалено &a%COUNT% &fвыброшенных предметов."
      - ""

DATABASE:
  TYPE: "SQLITE"
  SAVE-INTERVAL: 300
  CACHE:
    ENABLED: true
    MAX-ENTRIES: 250
    TTL-SECONDS: 300
    CLEANUP-INTERVAL: 60
  SYNC-INTERVAL: 40
  SYNC:
    MESSAGES-PER-POLL: 100
    CLEANUP-EVERY-POLLS: 50
    RETENTION-SECONDS: 120
  MYSQL:
    HOST: "127.0.0.1"
    PORT: 3306
    DATABASE: "core"
    USER: "root"
    PASSWORD: ""
    SSL: false
  SQLITE:
    FILE: "database.db"

SCOREBOARD:
  ENABLED: true
  UPDATE: 20
  NUMBERS:
    HIDDEN: true
  PERFORMANCE:
    PLAYERS-PER-UPDATE: 100
  TITLE:
    - "<gradient:#00E5FF:#0066FF>CORE</gradient>"
  LINES:
    - "&7"
    - "&fИгрок: &b%nick%"
    - "&fОнлайн: &b%online%"
    - "&fУбийства: &b%kills%"
    - "&fСмерти: &b%death%"
    - "&fВремя: &b%CORE_TIME%"
    - "&7"
    - "&#55FFFFplay.example.net"

TAB:
  ENABLED: true
  UPDATE: 20
  GROUPS:
    ENABLED: true
  SORTING_TYPES:
    - "GROUPS:rabotnuchek,owner,gladmin,admin,mladmin,stmoder,moder,mlmoder,sthelper,helper,sezon,diktator,imperator,vlastelin,titan,flame,manera,ares,knyaz,legend,ricar,princ,berserk,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  HEADER:
    - ""
    - "<gradient:#00E5FF:#0066FF>CORE</gradient>"
    - "&7Онлайн: &f%online%"
    - ""
  FOOTER:
    - ""
    - "&7Ваше время: &f%CORE_TIME%"
    - ""

NAMETAG:
  ENABLED: true
  GROUPS:
    ENABLED: true
  MODE: "PING"
  UPDATE: 40
  DISPLAY:
    - "&7ms"

ANNOUNCER:
  ENABLED: true
  INTERVAL: 300
  MESSAGES:
    1:
      - ""
      - "&bИнформация &8» &fИспользуйте &b/core&f, чтобы посмотреть данные сервера."
      - ""
    2:
      - ""
      - "&bИнформация &8» &fИспользуйте &b/playtime&f, чтобы посмотреть наигранное время."
      - ""
    3:
      - ""
      - "&bИнформация &8» &fИспользуйте &b/lang&f, чтобы выбрать язык."
      - ""

SCREEN-TEXT:
  ENABLED: false
  TYPE: "ACTIONBAR"
  UPDATE: 20
  TEXT:
    - "&fОнлайн: &b%online% &8| &fВремя: &b%CORE_TIME%"
  SUBTITLE:
    - ""

MENU:
  TITLE: "&8Данные сервера"
  SIZE: 27
  SLOT: 13
  ITEM: "BARRIER"
  NAME: "&cИнформация"
  VERSION: "0.0.1"
  LORE:
    - "&7Версия ядра проекта: &f%VERSION%"
    - "&7Загружено языков: &f%LANGS%"
    - "&7Список локализации: &f[%LANG-LIST%]"

PLAY:
  SERVERS:
    SERVER-1: "server-1"
    SERVER-2: "server-2"

TIME:
  SECONDS:
    - "%secondr% сек"
  MINUTES:
    - "%minutes% мин %secondr% сек"
  HOURS:
    - "%hourse% ч"
  PLURAL:
    HOURS:
      - "час"
      - "часа"
      - "часов"
    MINUTES:
      - "минута"
      - "минуты"
      - "минут"
    SECONDS:
      - "секунда"
      - "секунды"
      - "секунд"
