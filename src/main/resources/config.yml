SERVER: "server-1"

VAIP:
  ENABLED: true
  SERVERS:
    SURVIVAL:
      ID: "survival-wipe-1"
      NAME: "Выживание"
      TIME: "7d"
      MESSAGES:
        COMPLETED:
          - ""
          - "&cВАЙП &8» &fВайп сервера &c%server% &fпроизошёл!"
          - ""

RESOURCE-PACK:
  ENABLED: true
  URL: "https://drive.usercontent.google.com/download?id=1kfnwO-B9HjhZJYK4QPC27b0KJxHPfxkx&export=download&confirm=t"
  HASH: "07d732048c7f02147b704eb4bdbbbb2f1bcd1d05"
  REQUIRED: true
  DELAY: 20
  PROMPT: "&eДля игры необходимо принять ресурс-пак."

PROTOCOLLIB:
  ENABLED: true
  DUPLICATE-WINDOW-MILLIS: 100

MESSAGES:
  HIDE:
    ADVANCEMENTS: true
    JOIN: true
    QUIT: true
    DEATHS: true

GAME-RULES:
  LOCATOR-BAR: false

CLIENT-VERSIONS:
  ENABLED: true
  MINIMUM: "1.16.5"
  MAXIMUM: "26.2"
  REQUIRE-VIABACKWARDS: true
  CHECK-DELAY: 2
  MESSAGE:
    - "&cВерсия вашего клиента не поддерживается."
    - "&7Поддерживаемые версии: &f%MINIMUM%&7-&f%MAXIMUM%"

DEBUG:
  ENABLED: true
  SOURCES:
    DONATIONALERTS: true
    FREESYSTEM: true
    DONATEPOINTS: true

ENTITY-LIMITER:
  ENABLED: true
  CHECK-INTERVAL: 60
  MINIMUM-AGE: 600
  WORLDS:
    DEFAULT:
      ENABLED: true
      MAX-ITEMS: 100
      MAX-EXPERIENCE: 100
      MAX-PROJECTILES: 100
      MAX-FALLING-BLOCKS: 25
      MAX-MONSTERS: 150
      MAX-ANIMALS: 80
    spawn:
      ENABLED: true
      MAX-ITEMS: 40
      MAX-EXPERIENCE: 40
      MAX-PROJECTILES: 30
      MAX-FALLING-BLOCKS: 10
      MAX-MONSTERS: 30
      MAX-ANIMALS: 20

ITEM-CLEANER:
  ENABLED: true
  CHECK-INTERVAL: 300
  MINIMUM-ITEMS: 50
  CLEAR-DELAY: 30
  WARNING-SECONDS:
    - 30
    - 10
    - 5
  MESSAGES:
    WARNING:
      - ""
      - "&eОптимизация сервера &8» &fЧерез &e%SECONDS% сек. &fбудет выполнена очистка выброшенных предметов."
      - "&7Подберите важные предметы с земли."
      - ""
    CLEARED:
      - ""
      - "&aОптимизация сервера &8» &fУдалено &a%COUNT% &fвыброшенных предметов."
      - ""

DATABASE:
  TYPE: "SQLITE"
  SAVE-INTERVAL: 300
  CACHE:
    ENABLED: true
    MAX-ENTRIES: 250
    TTL-SECONDS: 300
    CLEANUP-INTERVAL: 60
  SYNC-INTERVAL: 20
  SYNC:
    MESSAGES-PER-POLL: 250
    CLEANUP-EVERY-POLLS: 300
    RETENTION-SECONDS: 300
  MYSQL:
    HOST: "127.0.0.1"
    PORT: 3306
    DATABASE: "core"
    USER: "root"
    PASSWORD: ""
    SSL: false
  SQLITE:
    FILE: "database.db"

SCOREBOARD:
  ENABLED: true
  UPDATE: 20
  NUMBERS:
    HIDDEN: true
  PERFORMANCE:
    PLAYERS-PER-UPDATE: 100
  TITLE:
    - "<gradient:#00E5FF:#0066FF>CORE</gradient>"
  LINES:
    - "&7"
    - "&fИгрок: &b%nick%"
    - "&fОнлайн: &b%online%"
    - "&fУбийства: &b%kills%"
    - "&fСмерти: &b%death%"
    - "&fВремя: &b%CORE_TIME%"
    - "&7"
    - "&#55FFFFplay.example.net"

TAB:
  ENABLED: true
  UPDATE: 20
  GROUPS:
    ENABLED: true
  SORTING_TYPES:
    - "GROUPS:rabotnuchek,owner,gladmin,admin,mladmin,stmoder,moder,mlmoder,sthelper,helper,sezon,diktator,imperator,vlastelin,titan,flame,manera,ares,knyaz,legend,ricar,princ,berserk,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  HEADER:
    - ""
    - "<gradient:#00E5FF:#0066FF>CORE</gradient>"
    - "&7Онлайн: &f%online%"
    - ""
  FOOTER:
    - ""
    - "&7Ваше время: &f%CORE_TIME%"
    - ""

BOSSBARS:
  ENABLED: true
  UPDATE: 20
  BARS:
    MAIN:
      ENABLED: true
      COLOR: "BLUE"
      STYLE: "SOLID"
      PROGRESS: 1.0
      TITLE:
        - "&fОнлайн: &b%online% &8| &fВремя: &b%CORE_TIME%"

NAMETAG:
  ENABLED: true
  GROUPS:
    ENABLED: true
  MODE: "PING"
  UPDATE: 40
  DISPLAY:
    - "&7ms"

ANNOUNCER:
  ENABLED: true
  INTERVAL: 300
  MESSAGES:
    1:
      - ""
      - "&bИнформация &8» &fИспользуйте &b/core&f, чтобы посмотреть данные сервера."
      - ""
    2:
      - ""
      - "&bИнформация &8» &fИспользуйте &b/playtime&f, чтобы посмотреть наигранное время."
